project_id = "clothes-selector"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "clothesselector://"
additional_redirect_urls = ["clothesselector://**", "http://localhost:*/sign-in", "http://localhost:*/reset-password", "http://127.0.0.1:*/sign-in", "http://127.0.0.1:*/reset-password"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "12MiB"

[functions.analyze-garment]
verify_jwt = true
